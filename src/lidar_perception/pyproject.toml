[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-av-lidar"
version = "0.1.0"
description = "LiDAR processing pipeline for nvidia/PhysicalAI-Autonomous-Vehicles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",      # parquet backend
    "scipy>=1.10",        # KD-tree DBSCAN
]

[project.optional-dependencies]
hf = [
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["physical_ai_av_lidar*"]
